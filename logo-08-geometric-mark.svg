<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#F1F3F6"/>
  <g transform="translate(50, 40)">
    <g transform="translate(50, 50) scale(3.5)">
      <!-- Grid-based RF -->
      <g stroke="#006D77" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-12 -10 L-12 10 Q-6 14 0 10 L0 -10 Q-6 -14 -12 -10 M0 0 L6 10"/>
        <path d="M6 -10 L6 10 M6 -10 L14 -10 M6 0 L12 0"/>
