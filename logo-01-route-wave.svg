<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <!-- Background -->
  <rect width="400" height="300" fill="#F1F3F6"/>
  <!-- Concept 1: Route Wave -->
  <g transform="translate(50, 40)">
    <!-- Logo mark -->
    <g transform="translate(50, 50) scale(2)">
      <!-- Wave path forming an R -->
      <path d="M10 50 Q25 20, 40 50 Q55 80, 70 50 Q85 20, 100 50" 
            stroke="#006D77" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Flow dots -->
      <circle cx="20" cy="45" r="3" fill="#006D77" opacity="0.6"/>
      <circle cx="40" cy="55" r="3" fill="#006D77" opacity="0.4"/>
      <circle cx="60" cy="45" r="3" fill="#006D77" opacity="0.6"/>
      <circle cx="80" cy="55" r="3" fill="#006D77" opacity="0.4"/>
      <!-- Start pin -->
      <path d="M10 50 L10 35" stroke="#006D77" stroke-width="3" stroke-linecap="round"/>
      <circle cx="10" cy="32" r="5" fill="#006D77"/>
      <circle cx="10" cy="32" r="2" fill="white"/>
      <!-- End arrow -->
      <path d="M100 50 L110 50" stroke="#006D77" stroke-width="3" stroke-linecap="round"/>
      <polygon points="110,46 118,50 110,54" fill="#006D77"/>
    </g>
    
    <!-- Wordmark -->
    <text x="150" y="220" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#1A1F2E" text-anchor="middle" letter-spacing="2">RouteFlow</text>
    <text x="150" y="250" font-family="system-ui, sans-serif" font-size="11" fill="#5A6A7E" text-anchor="middle">1. Route Wave — Flowing path → ocean wave metaphor</text>
  </g>
</svg>