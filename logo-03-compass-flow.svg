<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#F1F3F6"/>
  <g transform="translate(50, 40)">
    <g transform="translate(50, 50) scale(1.8)">
      <!-- Compass circle -->
      <circle cx="0" cy="0" r="40" fill="none" stroke="#006D77" stroke-width="2" opacity="0.3"/>
      <!-- Cardinal points -->
      <g stroke="#006D77" stroke-width="2.5" stroke-linecap="round">
        <path d="M0 -35 L0 -15" stroke="#006D77" stroke-width="4"/>
        <polygon points="0,-38 -4,-28 4,-28" fill="#006D77"/>
        <path d="M15 0 L35 0" opacity="0.5"/>
        <polygon points="38,0 28,-4 28,4" fill="#006D77" opacity="0.5"/>
        <path d="M0 15 L0 35" opacity="0.5"/>
        <polygon points="0,38 -4,28 4,28" fill="#006D77" opacity="0.5"/>
        <path d="M-35 0 L-15 0" opacity="0.5"/>
        <polygon points="-38,0 -28,-4 -28,4" fill="#006D77" opacity="0.5"/>
      </g>
      <!-- Flow arrows orbiting -->
      <g transform="rotate(0)">
        <path d="M30 -10 A25 25 0 0 1 10 30" stroke="#006D77" stroke-width="2.5" fill="none" opacity="0.7"/>
        <polygon points="10,30 14,22 6,24" fill="#006D77" opacity="0.7"/>
      </g>
      <g transform="rotate(90)">
        <path d="M30 -10 A25 25 0 0 1 10 30" stroke="#006D77" stroke-width="2" fill="none" opacity="0.4"/>
        <polygon points="10,30 14,22 6,24" fill="#006D77" opacity="0.4"/>
      </g>
      <g transform="rotate(-90)">
        <path d="M30 -10 A25 25 0 0 1 10 30" stroke="#006D77" stroke-width="2" fill="none" opacity="0.4"/>
        <polygon points="10,30 14,22 6,24" fill="#006D77" opacity="0.4"/>
      </g>
      <circle cx="0" cy="0" r="4" fill="#006D77"/>
    </g>
    <text x="150" y="220" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#1A1F2E" text-anchor="middle" letter-spacing="2">RouteFlow</text>
    <text x="150" y="250" font-family="system-ui, sans-serif" font-size="11" fill="#5A6A7E" text-anchor="middle">3. Compass Flow — Compass rose → directional flow arrows</text>
  </g>
</svg>