<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#F1F3F6"/>
  <g transform="translate(50, 40)">
    <g transform="translate(80, 50) scale(2.5)">
      <!-- ر (Reh) - stylized route/path -->
      <path d="M0 0 L0 -35 Q15 -45 30 -35 L30 5" stroke="#006D77" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="15" cy="-42" r="2.5" fill="#006D77"/>
      
      <!-- ف (Feh) - stylized flow/wave -->
      <path d="M50 -5 Q65 -20 80 -5 Q95 10 80 20 L60 20" stroke="#006D77" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="65" cy="-18" r="2.5" fill="#006D77"/>
      <circle cx="70" cy="25" r="2.5" fill="#006D77"/>
      
      <!-- Connecting flow line -->
      <path d="M30 5 Q40 0 50 -5" stroke="#006D77" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.5" stroke-dasharray="5,5"/>
    </g>
    <text x="150" y="220" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#1A1F2E" text-anchor="middle" letter-spacing="2">RouteFlow</text>
    <text x="150" y="250" font-family="system-ui, sans-serif" font-size="11" fill="#5A6A7E" text-anchor="middle">4. Kufic Monogram (ر‌ف) — Persian initials in Kufic style</text>
  </g>
</svg>