<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#F1F3F6"/>
  <g transform="translate(50, 40)">
    <g transform="translate(50, 50) scale(2)">
      <!-- Pin shape -->
      <path d="M25 5 C25 5 25 35, 25 35 C25 35 0 60, 25 60 C50 60 75 35 75 35 C75 35 75 5, 75 5 C75 5 25 5, 25 5 Z" 
            fill="#006D77" opacity="0.15" stroke="#006D77" stroke-width="2"/>
      <circle cx="25" cy="25" r="10" fill="#006D77"/>
      <circle cx="25" cy="25" r="4" fill="white"/>
      
      <!-- Network connections -->
      <g stroke="#006D77" stroke-width="1.5" opacity="0.5">
        <line x1="25" y1="25" x2="5" y2="10"/>
        <line x1="25" y1="25" x2="45" y2="5"/>
        <line x1="25" y1="25" x2="50" y2="25"/>
        <line x1="25" y1="25" x2="45" y2="45"/>
        <line x1="25" y1="25" x2="5" y2="40"/>
        <line x1="25" y1="25" x2="15" y2="55"/>
      </g>
      <!-- Node circles -->
      <g fill="#006D77">
        <circle cx="5" cy="10" r="3" opacity="0.7"/>
        <circle cx="45" cy="5" r="3" opacity="0.7"/>
        <circle cx="50" cy="25" r="3" opacity="0.7"/>
        <circle cx="45" cy="45" r="3" opacity="0.7"/>
        <circle cx="5" cy="40" r="3" opacity="0.7"/>
        <circle cx="15" cy="55" r="3" opacity="0.7"/>
      </g>
    </g>
    <text x="150" y="220" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#1A1F2E" text-anchor="middle" letter-spacing="2">RouteFlow</text>
    <text x="150" y="250" font-family="system-ui, sans-serif" font-size="11" fill="#5A6A7E" text-anchor="middle">2. Network Pin — Location pin → connected network nodes</text>
  </g>
</svg>