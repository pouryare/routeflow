<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#F1F3F6"/>
  <g transform="translate(50, 40)">
    <g transform="translate(80, 50) scale(3)">
      <!-- Unified RF arrow glyph -->
      <path d="M-20 -10 L-20 10 L-5 10 L-5 20 L15 0 L-5 -20 L-5 -10 L-20 -10 Z" fill="#006D77"/>
      <!-- Negative space cut for F -->
      <path d="M-5 -5 L5 -5 L5 5 L0 5 L0 15 L-5 15 Z" fill="#F1F3F6"/>
      <!-- Accent line -->
      <path d="M-20 0 L-5 0" stroke="white" stroke-width="1.5" opacity="0.5"/>
    </g>
    <text x="150" y="220" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#1A1F2E" text-anchor="middle" letter-spacing="2">RouteFlow</text>
    <text x="150" y="250" font-family="system-ui, sans-serif" font-size="11" fill="#5A6A7E" text-anchor="middle">10. Arrow Ligature — R + F + → merged into single glyph</text>
  </g>
</svg>