<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#F1F3F6"/>
  <g transform="translate(50, 40)">
    <g transform="translate(50, 50) scale(2.5)">
      <!-- Map sheet -->
      <path d="M-30 -25 L30 -25 L30 25 L-30 25 Z" fill="#F1F3F6" stroke="#006D77" stroke-width="1.5" opacity="0.3"/>
      <!-- Folded corner -->
      <path d="M10 -25 L30 -25 L30 10 Z" fill="#006D77" opacity="0.15" stroke="#006D77" stroke-width="1.5"/>
      <path d="M10 -25 L30 10" stroke="#006D77" stroke-width="2" stroke-dasharray="3,3" opacity="0.5"/>
      <!-- Route on map -->
      <path d="M-20 0 Q-5 -15 10 0 Q20 10 25 -5" stroke="#006D77" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Route dots -->
      <g fill="#006D77">
        <circle cx="-20" cy="0" r="2.5"/>
        <circle cx="-5" cy="-15" r="2.5" opacity="0.6"/>
        <circle cx="10" cy="0" r="2.5"/>
        <circle cx="25" cy="-5" r="2.5" opacity="0.6"/>
      </g>
      <!-- Fold shadow -->
      <path d="M10 -25 L30 10" stroke="#006D77" stroke-width="8" opacity="0.05" stroke-linecap="round"/>
    </g>
    <text x="150" y="220" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#1A1F2E" text-anchor="middle" letter-spacing="2">RouteFlow</text>
    <text x="150" y="250" font-family="system-ui, sans-serif" font-size="11" fill="#5A6A7E" text-anchor="middle">9. Map Fold — Folded map corner → route revealed</text>
  </g>
</svg>