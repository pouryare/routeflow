<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Identical to app/icon.svg -- kept as a second copy on purpose. app/icon.svg is
       Next's file-convention icon (auto-linked into every page's <head>, but served at
       a query-stringed /icon?<hash> URL, not a stable path). manifest.ts's icons array
       needs one fixed, predictable URL for PWA installability, which only a public/
       asset provides. If the mark ever changes, update both files together. -->
  <path d="M20,0 L80,0 A20,20 0 0 1 100,20 L100,80 A20,20 0 0 1 80,100 L20,100 A20,20 0 0 1 0,80 L0,20 A20,20 0 0 1 20,0 Z" fill="#101216"/>
  <path d="M15,72 Q50,15 85,58" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" fill="none" opacity=".55"/>
  <circle cx="15" cy="72" r="3" fill="#FFFFFF" opacity=".55"/>
  <circle cx="85" cy="58" r="3" fill="#FFFFFF" opacity=".55"/>
  <circle cx="50" cy="40" r="13" fill="none" stroke="#FFFFFF" stroke-width="1.6" opacity=".4"/>
  <circle cx="50" cy="40" r="8" fill="#FFFFFF"/>
</svg>
