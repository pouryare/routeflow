# RouteFlow's PostgreSQL settings. install.sh copies this to conf.d/ (Debian and Ubuntu include
# that folder from postgresql.conf). Sizing lines are for a 4 core, 16 GB machine with the
# database and the app together; scale shared_buffers to a quarter of RAM and
# effective_cache_size to three quarters.

listen_addresses = 'localhost'          # the app is on this machine; open it only behind a firewall
max_connections = 100
shared_buffers = 4GB
effective_cache_size = 12GB
work_mem = 16MB
maintenance_work_mem = 512MB

# Logical decoding is kept on for later (a read replica, change feeds); pgBackRest needs replica or above.
wal_level = logical
max_wal_senders = 10
max_replication_slots = 10

# Backups: every WAL segment goes to the pgBackRest repository as soon as it fills, or after a minute.
archive_mode = on
archive_command = 'pgbackrest --stanza=routeflow archive-push %p'
archive_timeout = 60

password_encryption = scram-sha-256
timezone = 'UTC'                        # the app stores UTC and shows Tehran time itself
log_timezone = 'UTC'

shared_preload_libraries = 'pg_stat_statements'   # install.sh adds pg_duckdb when it is installed
track_io_timing = on
log_min_duration_statement = 500        # ms; slow statements show up in the log
log_lock_waits = on
log_checkpoints = on
log_line_prefix = '%m [%p] %q%u@%d '
