# /etc/pgbackrest/pgbackrest.conf. install.sh fills in the values in <angle brackets> from its
# environment. Two copies of every backup and WAL segment:
#   repo1  on this machine (fast restores, covers a dropped table or a bad deploy)
#   repo2  on a second machine you own, over SSH/SFTP (covers losing this machine)
[global]
repo1-path=/var/lib/pgbackrest
repo1-retention-full=2
repo1-retention-diff=7

repo2-type=sftp
repo2-path=<OFFSITE_PATH>
repo2-sftp-host=<OFFSITE_HOST>
repo2-sftp-host-user=<OFFSITE_USER>
repo2-sftp-private-key-file=/var/lib/postgresql/.ssh/routeflow_backup
repo2-sftp-host-key-hash-type=sha256
repo2-sftp-host-key-check-type=strict
repo2-retention-full=4
repo2-retention-diff=14

# Encrypt what leaves this machine. The passphrase is in /etc/pgbackrest/cipher-pass (mode 600);
# keep a copy somewhere other than the two machines, or the backups cannot be read.
repo1-cipher-type=aes-256-cbc
repo1-cipher-pass=<CIPHER_PASS>
repo2-cipher-type=aes-256-cbc
repo2-cipher-pass=<CIPHER_PASS>

start-fast=y
compress-type=zst
log-level-console=info
process-max=2

[routeflow]
pg1-path=<PGDATA>
pg1-socket-path=/var/run/postgresql
