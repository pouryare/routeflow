name: CI

# Minutes are billed per job (private repo, 2,000 free a month). To keep that down:
#  - one job, run on pull requests only; draft pull requests are not tested (mark the PR ready once
#    and CI runs on that head), and nothing re-runs after the merge
#  - changes that touch only docs or notes do not run CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job: the app runs on PostgreSQL only. The server image builds, types and lint pass, the
  # migrations pass Squawk, the unit suite runs against PostgreSQL, the production build meets its
  # page-time budget, and the server scripts check out.
  check:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      SESSION_SECRET: ci-secret-not-for-production-0123456789
      DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          check-latest: true
          cache: npm

      - run: npm ci

      - name: Build the PostgreSQL image (db/Dockerfile)
        run: docker build -t routeflow-postgres db

      # fsync off and more connections: a throwaway CI database with one copy per test file.
      - name: Start PostgreSQL
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=ci -p 5432:5432 --shm-size=1g routeflow-postgres \
            postgres -c shared_preload_libraries=pg_stat_statements,pg_duckdb -c wal_level=logical \
                     -c max_connections=400 -c fsync=off -c synchronous_commit=off -c full_page_writes=off
          # The image runs its init scripts on a temporary server, then restarts for real.
          for i in $(seq 1 120); do docker logs pg 2>&1 | grep -q "PostgreSQL init process complete" && break; sleep 1; done
          for i in $(seq 1 60); do docker exec pg pg_isready -h localhost -U postgres -q && break; sleep 1; done
          docker logs pg 2>&1 | tail -5

      - name: Every extension is installed
        run: |
          got=$(docker exec pg psql -U postgres -tAc "SELECT string_agg(extname, ',' ORDER BY extname) FROM pg_extension")
          echo "$got"
          for e in btree_gist pg_duckdb pg_stat_statements pg_trgm postgis; do echo ",$got," | grep -q ",$e," || { echo "missing $e"; exit 1; }; done
          docker exec pg psql -U postgres -tAc "SHOW wal_level" | grep -qx logical

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Structural ratchet (docs/architecture-audit-2026-10-22.md): import cycles, direct database
      # imports in routes/pages, lib/db.ts size, tenant SELECTs with no organisation scope. Each
      # number may only fall; after improving one, run `node scripts/check-architecture.mjs --write`.
      - name: Architecture ratchet
        run: npm run check:architecture

      - name: Migrations pass Squawk
        run: npm run db:pg:lint

      # tests/playwrightExtract needs a real browser and tests/smoke drives one; both have their own
      # config and are not part of this job.
      - name: Unit tests on PostgreSQL
        run: npm test

      - name: Kysely types match the database
        run: DATABASE_URL=postgres://postgres:ci@localhost:5432/rf_template npx kysely-codegen --verify

      # The server scripts (db/server, scripts/pg) parse, and the doctor passes on a freshly migrated
      # database: every table with organization_id has its policy, the app role cannot see other
      # companies, the sync triggers are there. Backups are skipped (no pgBackRest in this job).
      - name: Server scripts parse; doctor passes on the migrated template
        run: |
          bash -n db/server/install.sh
          for f in scripts/pg/*.mjs scripts/_db.mjs; do node --check "$f"; done
          RF_EXPECT_PGBACKREST=0 PG_APP_ROLE=routeflow_app \
            DATABASE_URL=postgres://postgres:ci@localhost:5432/rf_template node scripts/pg/doctor.mjs

      # Builds for production, seeds the small demo dataset into its own database, starts the server
      # and times every main page against a generous budget. This is what fails if a page suddenly
      # takes seconds, which is how a missing index or a new N+1 shows up.
      - name: Production build and page-time budget
        run: npm run perf:smoke
