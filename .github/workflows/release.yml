name: Release

# A version tag (v0.1.0) builds the app once and publishes one tarball per machine type on the
# GitHub release: linux-x64 for normal servers, linux-arm64 for ARM machines such as the Pi. Each
# comes with a .sha256 that `routeflow upgrade` checks before it unpacks anything.
#
# "Run workflow" on the Actions tab builds the same tarballs without a tag and keeps them as a
# workflow artifact for 7 days, to try a build before tagging it.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      # The build reads no data; these only satisfy modules that check them at import.
      SESSION_SECRET: release-build-not-a-real-secret-0123456789
      DATABASE_URL: postgres://unused@localhost/unused
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          check-latest: true
          cache: npm

      - name: The tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          want="v$(node -p 'require("./package.json").version')"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "tag $GITHUB_REF_NAME but package.json says $want"; exit 1; }

      - run: npm ci

      - name: Every migration is marked expand-only or contract
        run: node scripts/check-migrations.mjs

      - name: Build
        run: npx next build

      - name: Pack x64 and arm64
        run: |
          bash scripts/release/pack.sh x64
          bash scripts/release/pack.sh arm64
          ls -l dist

      - name: The x64 tarball starts and answers /api/health
        run: |
          mkdir -p /tmp/rel && tar -xzf dist/routeflow-*-linux-x64.tar.gz -C /tmp/rel --strip-components=1
          cd /tmp/rel && PORT=3999 HOSTNAME=127.0.0.1 NODE_ENV=production ./node/bin/node server.js > /tmp/rel.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3999/login >/dev/null 2>&1 && break; sleep 1; done
          # No database here, so health must answer 503 with the version, not crash.
          code=$(curl -s -o /tmp/health.json -w '%{http_code}' http://127.0.0.1:3999/api/health)
          cat /tmp/health.json; echo
          [ "$code" = 503 ] && grep -q "\"version\":\"$(cat /tmp/rel/VERSION)\"" /tmp/health.json || { cat /tmp/rel.log; exit 1; }

      - name: Keep the tarballs (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: routeflow-release
          path: dist/*
          retention-days: 7

      - name: Publish the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release made on the GitHub website before the build finished already exists: add the files to it.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 dist/install.sh --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 dist/install.sh --title "RouteFlow $GITHUB_REF_NAME" --generate-notes
          fi

  # Drops the new tarball in the server's incoming/ folder; the server applies it at UPGRADE_AT
  # (03:30 Tehran) with `routeflow upgrade-scheduled`. Runs only when the "production" environment
  # has its SSH settings (see docs/release-and-deploy.md); otherwise the release is just published.
  deploy:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - name: Skip when the server is not set up yet
        id: ready
        run: '[ -n "$DEPLOY_HOST" ] && echo go=1 >> "$GITHUB_OUTPUT" || echo "DEPLOY_HOST not set; nothing to send"'

      - name: Copy the tarball to the server
        if: steps.ready.outputs.go == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_ARCH: ${{ vars.DEPLOY_ARCH || 'x64' }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          # Pinned host key: a server that changed its key (or an impostor) is refused, never trusted.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          name="routeflow-${GITHUB_REF_NAME#v}-linux-$DEPLOY_ARCH.tar.gz"
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -p "$name" -p "$name.sha256" -D out
          (cd out && sha256sum -c "$name.sha256")
          ssh_opts=(-i ~/.ssh/id_deploy -o Port="${DEPLOY_PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          # The .sha256 goes last: the server ignores a tarball until its sum file is there.
          scp "${ssh_opts[@]}" "out/$name" "$DEPLOY_USER@$DEPLOY_HOST:/opt/routeflow/incoming/$name.part"
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "mv /opt/routeflow/incoming/$name.part /opt/routeflow/incoming/$name"
          scp "${ssh_opts[@]}" "out/$name.sha256" "$DEPLOY_USER@$DEPLOY_HOST:/opt/routeflow/incoming/"
          echo "Sent $name; the server applies it at its scheduled hour (or now: sudo routeflow upgrade-scheduled)."
