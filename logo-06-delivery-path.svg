<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#F1F3F6"/>
  <g transform="translate(50, 40)">
    <g transform="translate(50, 50) scale(2)">
      <!-- Path line -->
      <path d="M10 40 Q30 10, 60 40 Q90 70, 120 40" stroke="#006D77" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
      
      <!-- Start: Warehouse/Box -->
      <g transform="translate(10, 30)">
        <rect x="-12" y="-12" width="24" height="24" rx="3" fill="none" stroke="#006D77" stroke-width="2.5"/>
        <line x1="-6" y1="-12" x2="-6" y2="12" stroke="#006D77" stroke-width="2"/>
        <line x1="-12" y1="-4" x2="12" y2="-4" stroke="#006D77" stroke-width="2"/>
        <line x1="-12" y1="4" x2="12" y2="4" stroke="#006D77" stroke-width="1" opacity="0.5"/>
      </g>
      
      <!-- Middle: Waypoint -->
      <circle cx="60" cy="40" r="8" fill="#F1F3F6" stroke="#006D77" stroke-width="2.5"/>
      <circle cx="60" cy="40" r="3" fill="#006D77"/>
      
      <!-- End: Customer location (house) -->
      <g transform="translate(120, 30)">
        <path d="M-12 12 L0 -12 L12 12 Z" fill="#006D77" opacity="0.15" stroke="#006D77" stroke-width="2.5"/>
        <rect x="-5" y="2" width="10" height="10" fill="#006D77" opacity="0.2" stroke="#006D77" stroke-width="1.5"/>
      </g>
      
      <!-- Flow arrows along path -->
      <g fill="#006D77" opacity="0.7">
        <polygon points="25,30 32,25 32,35" transform="rotate(-20 28,30)"/>
        <polygon points="75,45 82,40 82,50" transform="rotate(10 78,45)"/>
        <polygon points="105,38 112,33 112,43" transform="rotate(-15 108,38)"/>
      </g>
    </g>
    <text x="150" y="220" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#1A1F2E" text-anchor="middle" letter-spacing="2">RouteFlow</text>
    <text x="150" y="250" font-family="system-ui, sans-serif" font-size="11" fill="#5A6A7E" text-anchor="middle">6. Delivery Path — Package box → route path → destination</text>
  </g>
</svg>