<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#F1F3F6"/>
  <g transform="translate(50, 40)">
    <g transform="translate(50, 50) scale(2.2)">
      <!-- Streamlines forming RF -->
      <g stroke="#006D77" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-30 -20 L-30 20 Q-20 25 -5 20 L-5 -20 Q-20 -25 -30 -20" stroke-width="3" opacity="0.8"/>
        <path d="M-30 -10 Q-15 -10 -5 -5" stroke-width="2" opacity="0.5"/>
        <path d="M10 -20 L10 20 M10 -15 Q25 -15 25 -5 Q25 5 10 5" stroke-width="3" opacity="0.8"/>
        <path d="M10 0 Q20 0 20 10" stroke-width="2" opacity="0.5"/>
      </g>
      <!-- Particle flow -->
      <g fill="#006D77">
        <circle cx="-25" cy="-15" r="2" opacity="0.8"/>
        <circle cx="-20" cy="0" r="1.5" opacity="0.6"/>
        <circle cx="-15" cy="15" r="2" opacity="0.8"/>
        <circle cx="15" cy="-15" r="2" opacity="0.8"/>
        <circle cx="22" cy="-5" r="1.5" opacity="0.6"/>
        <circle cx="20" cy="15" r="2" opacity="0.8"/>
      </g>
      <!-- Large flow arrow -->
      <path d="M-40 0 Q-10 -20 20 0 Q50 20 80 0" stroke="#006D77" stroke-width="2" fill="none" opacity="0.3" stroke-dasharray="8,4"/>
      <polygon points="80,0 72,-6 72,6" fill="#006D77" opacity="0.3"/>
    </g>
    <text x="150" y="220" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#1A1F2E" text-anchor="middle" letter-spacing="2">RouteFlow</text>
    <text x="150" y="250" font-family="system-ui, sans-serif" font-size="11" fill="#5A6A7E" text-anchor="middle">7. Ocean Current — Ocean accent → fluid dynamics, streamlines</text>
  </g>
</svg>