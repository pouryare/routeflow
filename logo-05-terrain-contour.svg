<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#F1F3F6"/>
  <g transform="translate(50, 40)">
    <g transform="translate(50, 50) scale(2.5)">
      <!-- Contour lines forming abstract RF -->
      <g stroke="#006D77" fill="none" stroke-linecap="round">
        <path d="M-35 -15 Q0 -30 35 -15 Q50 0 35 15 Q0 30 -35 15 Q-50 0 -35 -15" stroke-width="1.5" opacity="0.3"/>
        <path d="M-20 -10 L-20 10 Q-5 15 5 10 L5 -10" stroke-width="2.5" opacity="0.8"/>
        <path d="M15 -10 L15 10 M15 -5 Q25 -5 25 0 Q25 5 15 5" stroke-width="2.5" opacity="0.8"/>
        <circle cx="0" cy="0" r="2" fill="#006D77"/>
      </g>
      <!-- Flow direction indicators -->
      <g stroke="#006D77" stroke-width="1.5" fill="#006D77" opacity="0.6">
        <polygon points="-30,-20 -25,-12 -35,-12" transform="rotate(-30)"/>
        <polygon points="30,-20 25,-12 35,-12" transform="rotate(30)"/>
        <polygon points="-30,20 -25,12 -35,12" transform="rotate(30)"/>
        <polygon points="30,20 25,12 35,12" transform="rotate(-30)"/>
      </g>
    </g>
    <text x="150" y="220" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#1A1F2E" text-anchor="middle" letter-spacing="2">RouteFlow</text>
    <text x="150" y="250" font-family="system-ui, sans-serif" font-size="11" fill="#5A6A7E" text-anchor="middle">5. Terrain Contour — Topographic lines → Tehran districts contour map</text>
  </g>
</svg>